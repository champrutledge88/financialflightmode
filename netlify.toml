[build]
  command = "node --test"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you-download.html"
  status = 200
  force = true

[[redirects]]
  from = "/flight-plan-budget-system.html"
  to = "/#flight-briefing-form"
  status = 301
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Keep server modules and test fixtures out of the static public site.
[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true
