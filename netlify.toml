[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you-download.html"
  status = 200
  force = true

[[redirects]]
  from = "/flight-plan-budget-system.html"
  to = "/#flight-briefing-form"
  status = 301
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
