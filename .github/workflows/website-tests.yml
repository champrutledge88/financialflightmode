name: Website tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Website unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  browser:
    name: Website browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium and PDF tools
        run: |
          npx --no-install playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      # These checks use synthetic data and block external analytics and email.
      # The older test:browser command deliberately sends analytics and is not run here.
      - name: Check scorecard interactions and downloads
        run: npm run test:refinements
        env:
          SCORECARD_EVIDENCE_DIR: test-results/refinements
      - name: Check A4 and Letter report pagination
        run: npm run test:pagination
        env:
          SCORECARD_EVIDENCE_DIR: test-results/pagination
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
